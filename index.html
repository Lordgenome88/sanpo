<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Maru Gothic',sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 48px;background:#d8f0f5;}
.app{width:100%;max-width:400px;-webkit-tap-highlight-color: transparent;}
.bg-deco{background:linear-gradient(135deg,#dff0f7 0%,#d4efd6 55%,#cceaf5 100%);border-radius:24px;padding:24px 18px 28px;}
h1{font-size:26px;font-weight:700;color:#1a5c4a;text-align:center;margin-bottom:4px;letter-spacing:0.06em;}
.subtitle{font-size:12px;color:#4a8a76;text-align:center;margin-bottom:20px;letter-spacing:0.07em;}
.section{background:rgba(255,255,255,0.72);border:1px solid rgba(100,200,160,0.35);border-radius:16px;padding:14px 16px;margin-bottom:12px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:0.12em;color:#4a8a76;margin-bottom:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip-label{display:flex;align-items:center;cursor:pointer;user-select:none;}
.chip-label input{display:none;}
.chip{padding:7px 16px;border-radius:99px;border:1.5px solid rgba(100,180,150,0.4);font-size:13px;font-family:'Zen Maru Gothic',sans-serif;color:#3d7a68;background:rgba(255,255,255,0.6);transition:all 0.16s;font-weight:400;  -webkit-touch-callout: none;user-select: none;}
.chip-label input:checked + .chip{background:linear-gradient(120deg,#4db8d4,#52c19a);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(78,184,180,0.28);-webkit-tap-highlight-color: transparent;}
.btn{width:100%;padding:15px;border-radius:99px;border:none;background:linear-gradient(120deg,#3ab5cf,#3db891);color:#fff;font-family:'Zen Maru Gothic',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.1em;cursor:pointer;transition:all 0.18s;margin-top:4px;box-shadow:0 3px 14px rgba(60,180,160,0.32);outline: none;-webkit-tap-highlight-color: transparent;}
.btn:hover{filter:brightness(1.06);}
.btn:active{transform:scale(0.97);}
.reroll-btn {margin-top: 10px;width: 100%;padding: 10px;border-radius: 99px;border: 1.5px solid rgba(100,180,150,0.4);background:linear-gradient(120deg,#3ab5cf,#3db891);color:#fff;font-family: 'Zen Maru Gothic', sans-serif;font-size: 14px;font-weight: 700;cursor: pointer;-webkit-tap-highlight-color: transparent;outline: none;}
.result{background:rgba(255,255,255,0.8);border:1px solid rgba(100,200,160,0.3);border-radius:16px;padding:20px 18px;margin-top:12px;display:none;}
.result.show{display:block;animation:fadeUp 0.3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.result-tag{font-size:10px;letter-spacing:0.14em;font-weight:700;color:#4a8a76;margin-bottom:5px;}
.result-station{font-size:21px;font-weight:700;color:#1a5c4a;line-height:1.5;}
.station-line{font-size:11px;color:#6aaa90;margin-top:4px;letter-spacing:0.05em;}
.divider{height:1px;background:rgba(100,200,160,0.25);margin:14px 0;}
.result-purpose{font-size: 21px;font-weight: 700;color: #1e7fa8;line-height: 1.5;min-height: 2lh;}
.err{font-size:13px;color:#c0504d;text-align:center;padding:4px 0;}
</style>
</head>
<body>
<div class="app">

    <h1>散歩しよ</h1>
    <p class="subtitle">エリアと目的を決めて、散歩に出かける</p>
    <div class="section">
      <div class="section-label">エリア</div>
      <div class="chips" id="area-chips"></div>
    </div>
    <div class="section">
      <div class="section-label">目的</div>
      <div class="chips" id="purpose-chips"></div>
    </div>
    <button class="btn" onclick="generate()">でかける ›</button>
    <div class="result" id="result">
      <div class="result-tag">今日の駅</div>
      <div class="result-station" id="out-stations"></div>
      <div class="station-line" id="out-line"></div>
      <div class="divider"></div>
      <div class="result-tag">やること</div>
      <div class="result-purpose" id="out-purpose"></div>
      <button class="reroll-btn" id="reroll-btn" onclick="reroll()" style="display:none">やることを変える(目的変更可) ›</button>
    </div>
  </div>
</div>

    '川の源流','池のほとり','海岸','砂浜','岬','灯台',
  ]},
};

const purposeKeys=['撮る','やる','食べる','買う','描く','探す','寄る'];

function buildRadio(containerId,items,name,defaultIdx){
  const c=document.getElementById(containerId);
  items.forEach((v,i)=>{
    c.innerHTML+=`<label class="chip-label"><input type="radio" name="${name}" value="${v}"${i===defaultIdx?' checked':''}><span class="chip">${v}</span></label>`;
  });
}
function getVal(name){const el=document.querySelector(`input[name="${name}"]:checked`);return el?el.value:null;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function generate(){
  const area=getVal('area');
  const purpose=getVal('purpose');
  const result=document.getElementById('result');
  const outS=document.getElementById('out-stations');
  const outL=document.getElementById('out-line');
  const outP=document.getElementById('out-purpose');
  if(!area||!purpose){
    result.style.display='block';
    outS.innerHTML='<span class="err">エリアと目的を選んでね。</span>';
    outL.textContent='';outP.textContent='';return;
  }
  const lines=AREAS[area].lines;
  const lineName=pick(Object.keys(lines));
  const stations=lines[lineName];
  const idx=Math.floor(Math.random()*(stations.length-2));
  const trio=stations.slice(idx,idx+3);
  const pData=PURPOSES[purpose];
  const item=pick(pData.items);
  outS.textContent=trio.join(' › ');
  outL.textContent=`${area} ｜ ${lineName}`;
  // outP.textContent=pData.type === 'verb' ? item : `${item}を${purpose}`;
  // outP.textContent=pData.type === 'ni'   ? item : `${item}に${purpose}`;
  switch(pData.type){
    case 'verb':
      outP.textContent = item;
      break;
    case 'ni':
      outP.textContent = `${item}に${purpose}`;
      break;
    default:
      outP.textContent = `${item}を${purpose}`;
  }
  result.style.display='block';
  result.classList.remove('show');
  void result.offsetWidth;
  document.getElementById('reroll-btn').style.display = 'block';
  result.classList.add('show');
}
function reroll() {
  const purpose = getVal('purpose');
  const pData = PURPOSES[purpose];
  const item = pick(pData.items);
  const outP = document.getElementById('out-purpose');
  switch(pData.type){
    case 'verb':
      outP.textContent = item;
      break;
    case 'ni':
      outP.textContent = `${item}に${purpose}`;
      break;
    default:
      outP.textContent = `${item}を${purpose}`;
  }
}

document.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

let lastTap = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
}, { passive: false });

buildRadio('area-chips',['東京','神奈川','千葉','埼玉'],'area',0);
buildRadio('purpose-chips',purposeKeys,'purpose',0);
</script>
</body>
